# coturn — YOUR OWN STUN/TURN relay for the ceremony's peer-to-peer video.
#
# Self-hosted: this runs on a server YOU control. No third-party service is involved — coturn only
# forwards the participants' ALREADY-ENCRYPTED media when their networks block a direct browser-to-
# browser path (symmetric NAT / CGNAT). It cannot see or decode the video.
#
# You MUST edit ONE line below: external-ip. Everything else has sane defaults.

# ---- Ports ----
listening-port=3478          # STUN + TURN over UDP and TCP
tls-listening-port=5349      # TURN over TLS/DTLS (optional; harmless if unused)
min-port=49152               # relay UDP port range — OPEN THESE IN THE FIREWALL TOO
max-port=65535

# ---- REQUIRED: your server's PUBLIC IP ----
# On most VPSes this is the IP the provider gave you. If your VPS network card only shows a PRIVATE
# IP (some clouds NAT it behind the public one), write it as:  external-ip=PUBLIC_IP/PRIVATE_IP
external-ip=REPLACE_WITH_VPS_PUBLIC_IP

# ---- Auth: long-term static credentials (simple; they never expire) ----
lt-cred-mech
realm=tassel.local
user=tassel:YOUR_TURN_SECRET

# ---- Hardening: stop the relay being abused to reach private / internal hosts (SSRF) ----
no-cli
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# ---- Light abuse limits (tune as you like) ----
total-quota=100
stale-nonce=600
fingerprint
